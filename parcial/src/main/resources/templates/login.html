<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Iniciar Sesión</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 40px 36px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        .logo {
            text-align: center;
            margin-bottom: 28px;
        }
        .logo h1 {
            font-size: 1.8rem;
            color: #0f3460;
            font-weight: 700;
        }
        .logo p { color: #666; font-size: 0.9rem; margin-top: 4px; }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: border-color .2s;
            margin-bottom: 18px;
        }
        input:focus {
            outline: none;
            border-color: #0f3460;
        }
        .error-box {
            background: #fef2f2;
            border: 1px solid #fca5a5;
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 18px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .error-box .icon { font-size: 1.1rem; flex-shrink: 0; }
        .error-box p { color: #dc2626; font-size: 0.88rem; line-height: 1.4; }

        button[type="submit"] {
            width: 100%;
            padding: 13px;
            background: #0f3460;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background .2s, transform .1s;
        }
        button[type="submit"]:hover { background: #16213e; }
        button[type="submit"]:active { transform: scale(0.98); }

        .footer { text-align: center; margin-top: 20px; font-size: 0.82rem; color: #888; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">
        <h1>&#128274; Portal</h1>
        <p>Ingresa tus credenciales para continuar</p>
    </div>

    <!-- Mensaje de error -->
    <div class="error-box" th:if="${error}">
        <span class="icon">&#9888;&#65039;</span>
        <p th:text="${error}"></p>
    </div>

    <form method="post" th:action="@{/login}">
        <label for="username">Usuario</label>
        <input type="text"
               id="username"
               name="username"
               placeholder="Ingresa tu usuario"
               th:value="${username}"
               autocomplete="username"/>

        <label for="password">Contraseña</label>
        <input type="password"
               id="password"
               name="password"
               placeholder="Ingresa tu contraseña"
               autocomplete="current-password"/>

        <button type="submit">Iniciar Sesión</button>
    </form>

    <div class="footer">Ucompensar &mdash; Sistema de acceso</div>
</div>
</body>
</html>
